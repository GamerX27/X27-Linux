---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: x27-linux
description: X27-Linux - custom Fedora Kinoite with X27 config, KDE tweaks, Brave Origin, full codecs, and native Jellyfin Desktop, Finamp, and VLC
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: 45

modules:
  # system config, plus the base taskbar overlay (Brave, Dolphin, Konsole, Bazaar, and the
  # media apps). auto-update sets rpm-ostreed's AutomaticUpdatePolicy to stage.
  - type: files
    files:
      - source: system
        destination: /
      - source: base
        destination: /
      - source: auto-update
        destination: /

  # bootc image: package changes happen via dnf in the build container, not rpm-ostree.
  # All repo packages in one dnf step: each dnf step rewrites the whole rpmdb (~140 MB) into
  # a new layer, so separate steps make every update download it again.
  # Bazaar replaces Discover (removed below), as an RPM like Bazzite ships it: the Flatpak runs
  # sandboxed, where syncing the system Flathub remote fails, and could start before the network
  # was up and stay empty. krunner-bazaar puts its search results in KRunner. ublue-os/packages
  # also carries libadwaita/glycin builds; installed ones aren't swapped by an install, and
  # cleanup disables all the repos again afterwards.
  # Media apps, all native: VLC is Fedora's own build, running on the base image's negativo17
  # ffmpeg. Finamp and Jellyfin Desktop come from X27-Linux-Packages (git.xlabsx27.com); its
  # .repo brings both keys (packages and repo index). Finamp repackages upstream's Linux bundle;
  # Jellyfin Desktop is built there from upstream's source against Fedora's Qt WebEngine and
  # mpv, with libcec for TV remotes over HDMI-CEC (upstream has no Fedora build).
  # Removed with nothing requiring them: python3-boto3 & co. (AWS SDK from the Kinoite base)
  # and plasma-workspace-wallpapers (~300 MB of extra wallpapers; the defaults, Next and
  # Fedora, come from plasma-breeze-common and kde-settings).
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        - https://git.xlabsx27.com/X27/X27-Linux-Packages/raw/branch/main/x27-packages.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      copr:
        - lilay/topgrade
        - ublue-os/packages
      cleanup: true
    install:
      packages:
        - brave-origin
        - fastfetch
        - fish
        - htop
        - konsole
        - nano
        - nvtop
        - papirus-icon-theme
        - pciutils
        - lm_sensors
        - distrobox
        - topgrade
        - bazaar
        - krunner-bazaar
        - vlc
        - vlc-plugin-ffmpeg
        - finamp
        - jellyfin-desktop
        - easyeffects
        - virtualbox-guest-additions
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - khelpcenter
        - kate
        - kate-plugins
        - kate-krunner-plugin
        - filelight
        - kcharselect
        - kfind
        - plasma-discover
        - plasma-discover-notifier
        - NetworkManager-config-connectivity-fedora
        - python3-boto3
        - python3-botocore
        - python3-s3transfer
        - plasma-workspace-wallpapers

  # No Flatpaks by default: every app is a native RPM. KWrite is the Kinoite base's own (it
  # only needs kate-libs, which stays); Bazaar, VLC, Finamp, Jellyfin Desktop, and EasyEffects
  # are installed above. Kate, Filelight, KCharSelect, and KFind are dropped (removed above). This module still sets up
  # the Flathub remote for Bazaar, and its remove list uninstalls the Flatpaks earlier builds
  # installed, on rebased systems.
  - type: default-flatpaks@v1
    notify: true
    system:
      remove:
        - io.github.kolunmi.Bazaar
        - org.videolan.VLC
        - com.unicornsonlsd.finamp
        - org.jellyfin.JellyfinDesktop
        - org.kde.kate
        - org.kde.kwrite
        - org.kde.filelight
        - org.kde.kcharselect
        - org.kde.kfind
        - com.github.wwmm.easyeffects

  # Auto-updates: the image is staged in the background and used on the next reboot, and
  # Flatpaks update daily. bootc-fetch-apply-updates.timer stays masked since it reboots.
  # The Kinoite base masks rpm-ostreed-automatic.timer, and this module enables before it
  # unmasks, so the unmask is its own module first.
  - type: systemd
    system:
      unmasked:
        - rpm-ostreed-automatic.timer

  # x27-install-date.service (files/systemd/system/) stamps /var/lib/x27-linux/install-date on
  # first boot only, for fastfetch's OS Age - /var persists across updates, unlike /etc or /usr.
  # topgrade-reminder.timer (files/systemd/user/) stays off: updates happen on their own.
  - type: systemd
    system:
      enabled:
        - x27-install-date.service
        - x27-flathub-metadata.service
        - rpm-ostreed-automatic.timer
        - x27-flatpak-update.timer
      masked:
        - bootc-fetch-apply-updates.timer
        # Refreshes dnf metadata in the background, but dnf is guarded (x27-dnf-guard) and
        # updates go through rpm-ostree. dnf5-makecache.timer is an alias of it.
        - dnf-makecache.timer

  # Stock Fedora kernel, so Secure Boot works and any x86_64 CPU boots it.
  #
  # Codecs and hardware video acceleration. The BlueBuild base image already brings
  # negativo17's ffmpeg (x264, x265, fdk-aac), Mesa with VA-API for AMD (radeonsi), and Intel's
  # VA-API drivers (iHD for Broadwell and newer, i965 for older), then removes the repo again.
  # GStreamer is still Fedora's -free plugins there, so the full bad/ugly plugins come from
  # negativo17 here (--allowerasing lets them replace the -free builds), and Cisco's real
  # openh264 replaces the noopenh264 stub. negativo17's plugins-bad carries the openh264
  # GStreamer plugin itself (it obsoletes gstreamer1-plugin-openh264), so that's checked by
  # file. The negativo17 repo file is removed again; the Cisco repo stays enabled, as on
  # stock Fedora, so openh264 keeps updating.
  # The checks fail the build if any codec or VA-API driver goes missing.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && curl -fsSL -o /etc/yum.repos.d/negativo17-fedora-multimedia.repo \
                 https://negativo17.org/repos/fedora-multimedia.repo \
            && dnf5 -y config-manager setopt fedora-cisco-openh264.enabled=1 \
            && dnf5 -y swap noopenh264 openh264 \
            && dnf5 -y install --allowerasing gstreamer1-plugins-bad gstreamer1-plugins-ugly \
            && rm /etc/yum.repos.d/negativo17-fedora-multimedia.repo \
            && dnf5 clean all \
            && rpm -q libavcodec libfdk-aac x264-libs x265-libs openh264 \
                 gstreamer1-plugins-bad gstreamer1-plugins-ugly gstreamer1-plugin-libav \
                 libva libva-intel-media-driver intel-vaapi-driver libva-utils \
            && for pkg in libavcodec-free noopenh264 gstreamer1-plugins-bad-free gstreamer1-plugins-ugly-free; do \
                 if rpm -q "$pkg" >/dev/null; then echo "still installed: ${pkg}" >&2; exit 1; fi; \
               done \
            && test -f /usr/lib64/gstreamer-1.0/libgstopenh264.so \
            && test "$(rpm -q --qf '%{VENDOR}' libavcodec)" = negativo17.org \
            && for drv in radeonsi iHD i965; do \
                 test -f "/usr/lib64/dri/${drv}_drv_video.so" || { echo "missing VA-API driver: ${drv}" >&2; exit 1; }; \
               done \
            && rpm -q kernel-core \
            && ! rpm -qa | grep -q -i cachyos

  # No CachyOS packages: stock Fedora kernel, zram, and systemd-oomd defaults.
  # Plymouth theme before initramfs, which copies it in; no -R, the initramfs module rebuilds it.
  - type: containerfile
    snippets:
      - |
        RUN plymouth-set-default-theme bgrt \
            && test "$(plymouth-set-default-theme)" = bgrt

  # Regenerates initramfs to pick up the plymouth theme above. Must run after it.
  - type: initramfs

  # Sanity check: files/base's layout.js pins these desktop files in the taskbar.
  - type: containerfile
    snippets:
      - |
        RUN test -f /usr/share/applications/brave-origin.desktop \
            && test -f /usr/share/applications/org.kde.dolphin.desktop \
            && test -f /usr/share/applications/org.kde.konsole.desktop \
            && test -f /usr/share/applications/io.github.kolunmi.Bazaar.desktop \
            && test -f /usr/share/applications/vlc.desktop \
            && test -f /usr/share/applications/com.unicornsonlsd.finamp.desktop \
            && test -f /usr/share/applications/org.jellyfin.JellyfinDesktop.desktop \
            && rpm -q vlc vlc-plugin-ffmpeg finamp jellyfin-desktop easyeffects kwrite \
            && test -f /usr/share/applications/org.kde.kwrite.desktop \
            && ! rpm -q kate \
            && test -x /usr/bin/x27-clock

  # Brave Origin stays stock: no make_brave_great_again.sh. x-linuxtool is still included.
  - type: containerfile
    snippets:
      - |
        RUN curl -fsSL -o /usr/bin/x-linuxtool \
              https://codeberg.org/X27/X-Linuxtool/raw/branch/main/X-Linuxtool.sh \
            && chmod +x /usr/bin/x-linuxtool
      # localectl normally talks to systemd-localed over D-Bus; whether that's reachable
      # in this build step (no PID 1 systemd) is unverified here, so the sed/echo fallback
      # below (the previous approach) only fires if set_locale_time doesn't take.
      - |
        RUN info() { echo "[INFO] $*"; }; \
            ok()   { echo "[OK] $*"; }; \
            warn() { echo "[WARN] $*"; }; \
            err()  { echo "[ERR] $*"; }; \
            set_locale_time() { \
                info "Attempting to set LC_TIME to C.UTF-8..."; \
                if ! locales=$(localectl list-locales 2>/dev/null); then \
                    err "localectl is not available."; \
                    return 1; \
                fi; \
                if echo "$locales" | grep -q "C.UTF-8"; then \
                    if localectl set-locale LC_TIME=C.UTF-8; then \
                        ok "Successfully set LC_TIME."; \
                    else \
                        err "Failed to set the locale time."; \
                        return 1; \
                    fi; \
                else \
                    warn "C.UTF-8 locale not available. Skipping."; \
                fi; \
            }; \
            set_locale_time || { \
                if grep -q '^LC_TIME=' /etc/locale.conf 2>/dev/null; then \
                    sed -i 's/^LC_TIME=.*/LC_TIME=C.UTF-8/' /etc/locale.conf; \
                else \
                    echo 'LC_TIME=C.UTF-8' >> /etc/locale.conf; \
                fi; \
            }
      # VARIANT stays Kinoite: topgrade uses it to pick rpm-ostree over dnf.
      # Set directly here, not via BlueBuild's os-release module: a value substituted into
      # the recipe by an earlier workflow step doesn't survive blue-build's own checkout
      # right before the build starts.
      - |
        RUN set -eu \
            && BUILD_DATE="$(date -u +%Y-%m-%d)" \
            && . /etc/os-release \
            && sed -i --follow-symlinks -e '/^NAME=/d' -e '/^PRETTY_NAME=/d' -e '/^BUILD_ID=/d' /etc/os-release \
            && printf 'NAME="X27-Linux"\nPRETTY_NAME="X27-Linux %s (%s)"\nBUILD_ID="%s-%s"\n' \
                 "${VERSION_ID}" "${BUILD_DATE}" "${VERSION_ID}" "${BUILD_DATE}" >> /etc/os-release \
            && grep -qx 'VARIANT="Kinoite"' /etc/os-release

  # Last step: all dnf5 calls above are done. See files/system/usr/libexec/x27-dnf-guard.
  - type: containerfile
    snippets:
      - |
        RUN mv /usr/bin/dnf5 /usr/libexec/dnf5-real \
            && ln -s /usr/libexec/x27-dnf-guard /usr/bin/dnf5 \
            && test "$(readlink -f /usr/bin/dnf)" = /usr/libexec/x27-dnf-guard \
            && dnf5 --version

  - type: signing
