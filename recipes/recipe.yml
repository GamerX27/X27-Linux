---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: x27-linux
description: X27-Linux - custom Fedora Kinoite with X27 config, KDE tweaks, and Brave Origin
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: 44

modules:
  # system config, plus the base taskbar overlay: Brave/Dolphin/Konsole pins.
  - type: files
    files:
      - source: system
        destination: /
      - source: base
        destination: /

  # bootc image: package changes happen via dnf in the build container, not rpm-ostree.
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
      cleanup: true
    install:
      packages:
        - brave-origin
        - fastfetch
        - fish
        - htop
        - konsole
        - nano
        - nvtop
        - papirus-icon-theme
        - pciutils
        - lm_sensors
        - distrobox
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - khelpcenter
        - kate
        - kate-plugins
        - kate-krunner-plugin
        - kwrite
        - filelight
        - kcharselect
        - kfind
        - plasma-discover
        - plasma-discover-notifier
        - NetworkManager-config-connectivity-fedora

  # Bazaar replaces Discover (removed above). The ISO embeds VLC and Bazaar (flatpak_refs/) and
  # installs them offline; BlueBuild empties /var, so they can't ship in the image itself.
  # This installs them on first boot for systems that rebased instead.
  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        - org.videolan.VLC
        - io.github.kolunmi.Bazaar
        - org.kde.kate
        - org.kde.kwrite
        - org.kde.filelight
        - org.kde.kcharselect
        - org.kde.kfind
        - com.github.wwmm.easyeffects

  - type: dnf
    repos:
      copr:
        - lilay/topgrade
      cleanup: true
    install:
      packages:
        - topgrade

  # Bazaar search results in KRunner. Only this package comes from ublue-os/packages;
  # the copr is disabled again afterwards.
  - type: dnf
    repos:
      copr:
        - ublue-os/packages
      cleanup: true
    install:
      packages:
        - krunner-bazaar

  # Masks the base image's background auto-update timer; topgrade-reminder.timer
  # (files/systemd/user/) nudges weekly instead. x27-install-date.service
  # (files/systemd/system/) stamps /var/lib/x27-linux/install-date on first boot only,
  # for fastfetch's OS Age - /var persists across updates, unlike /etc or /usr.
  # x27-flathub-metadata.timer retries the Flathub metadata fill every minute until it
  # succeeds once, since the network (often Wi-Fi after login) can be down at boot.
  - type: systemd
    system:
      enabled:
        - x27-install-date.service
        - x27-flathub-metadata.timer
      masked:
        - bootc-fetch-apply-updates.timer
    user:
      enabled:
        - topgrade-reminder.timer

  # CachyOS kernel (BORE scheduler), needs an x86_64-v3 CPU. cleanup: false is deliberate:
  # the copr must stay enabled for the containerfile install below, then gets disabled there.
  - type: dnf
    repos:
      copr:
        - bieszczaders/kernel-cachyos
    install:
      packages:
        - sbsigntools
        - mokutil

  # kernel-cachyos Provides: kernel, so the stock kernel is removed first (installing the
  # new one first would remove it right back out). noscripts skips the RPM's post-install
  # kernel-install/dracut hook, which fails before depmod has run - depmod runs manually below.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && STOCK_KVER="$(rpm -q --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' kernel-core | tail -n1)" \
            && echo "Removing Fedora kernel ${STOCK_KVER}" \
            && dnf5 -y remove --no-autoremove \
                 kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra \
            && rm -rf "/usr/lib/modules/${STOCK_KVER}" \
            && dnf5 -y install --setopt=tsflags=noscripts \
                 kernel-cachyos kernel-cachyos-devel-matched \
            && dnf5 -y install --skip-unavailable virtualbox-guest-additions \
            && dnf5 -y copr disable bieszczaders/kernel-cachyos \
            && dnf5 clean all \
            && test "$(ls -1 /usr/lib/modules | wc -l)" -eq 1 \
            && KVER="$(ls -1 /usr/lib/modules)" \
            && test -f "/usr/lib/modules/${KVER}/vmlinuz" \
            && depmod -a "${KVER}" \
            && test -f "/usr/lib/modules/${KVER}/modules.dep" \
            && echo "Kernel now: ${KVER}"

  # CachyOS userspace tuning from bieszczaders/kernel-cachyos-addons: cachyos-settings (sysctl,
  # zram, udev, ntsync) and the sched-ext schedulers. cachyos-settings Conflicts with
  # zram-generator-defaults, hence the swap. Before initramfs: it adds modprobe.d/udev rules.
  # scx_loader stays disabled here; BORE from the kernel stays in charge.
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y copr enable bieszczaders/kernel-cachyos-addons \
            && dnf5 -y swap zram-generator-defaults cachyos-settings \
            && dnf5 -y install scx-scheds scx-tools \
            && dnf5 -y copr disable bieszczaders/kernel-cachyos-addons \
            && rpm -q cachyos-settings scx-scheds scx-tools

  # Regenerates initramfs to pick up the kernel swap above. Must run after it.
  - type: initramfs

  # Sanity check: files/base's layout.js pins these desktop files in the taskbar.
  - type: containerfile
    snippets:
      - |
        RUN test -f /usr/share/applications/brave-origin.desktop \
            && test -f /usr/share/applications/org.kde.dolphin.desktop \
            && test -f /usr/share/applications/org.kde.konsole.desktop

  # make_brave_great_again.sh's /etc/hosts step always fails here (buildah bind-mounts it
  # read-only during RUN) and is ignored; the policy file it writes is verified explicitly instead.
  - type: containerfile
    snippets:
      - |
        RUN curl -fsSL -o /usr/bin/x-linuxtool \
              https://codeberg.org/X27/X-Linuxtool/raw/branch/main/X-Linuxtool.sh \
            && chmod +x /usr/bin/x-linuxtool
      - |
        RUN set -eu; \
            curl -fsSL -o /tmp/make_brave_great_again.sh \
              https://codeberg.org/X27/X-Linuxtool/raw/branch/main/Desktop/Linux-Desktop/Browser/make_brave_great_again.sh; \
            chmod +x /tmp/make_brave_great_again.sh; \
            /tmp/make_brave_great_again.sh || true; \
            test -f /etc/brave/policies/managed/make_brave_great_again.json; \
            rm -f /tmp/make_brave_great_again.sh
      # localectl normally talks to systemd-localed over D-Bus; whether that's reachable
      # in this build step (no PID 1 systemd) is unverified here, so the sed/echo fallback
      # below (the previous approach) only fires if set_locale_time doesn't take.
      - |
        RUN info() { echo "[INFO] $*"; }; \
            ok()   { echo "[OK] $*"; }; \
            warn() { echo "[WARN] $*"; }; \
            err()  { echo "[ERR] $*"; }; \
            set_locale_time() { \
                info "Attempting to set LC_TIME to C.UTF-8..."; \
                if ! locales=$(localectl list-locales 2>/dev/null); then \
                    err "localectl is not available."; \
                    return 1; \
                fi; \
                if echo "$locales" | grep -q "C.UTF-8"; then \
                    if localectl set-locale LC_TIME=C.UTF-8; then \
                        ok "Successfully set LC_TIME."; \
                    else \
                        err "Failed to set the locale time."; \
                        return 1; \
                    fi; \
                else \
                    warn "C.UTF-8 locale not available. Skipping."; \
                fi; \
            }; \
            set_locale_time || { \
                if grep -q '^LC_TIME=' /etc/locale.conf 2>/dev/null; then \
                    sed -i 's/^LC_TIME=.*/LC_TIME=C.UTF-8/' /etc/locale.conf; \
                else \
                    echo 'LC_TIME=C.UTF-8' >> /etc/locale.conf; \
                fi; \
            }
      - |
        RUN plymouth-set-default-theme -R bgrt
      # VARIANT stays Kinoite: topgrade uses it to pick rpm-ostree over dnf.
      # Set directly here, not via BlueBuild's os-release module: a value substituted into
      # the recipe by an earlier workflow step doesn't survive blue-build's own checkout
      # right before the build starts.
      - |
        RUN set -eu \
            && BUILD_DATE="$(date -u +%Y-%m-%d)" \
            && . /etc/os-release \
            && sed -i --follow-symlinks -e '/^NAME=/d' -e '/^PRETTY_NAME=/d' -e '/^BUILD_ID=/d' /etc/os-release \
            && printf 'NAME="X27-Linux"\nPRETTY_NAME="X27-Linux %s (%s)"\nBUILD_ID="%s-%s"\n' \
                 "${VERSION_ID}" "${BUILD_DATE}" "${VERSION_ID}" "${BUILD_DATE}" >> /etc/os-release \
            && grep -qx 'VARIANT="Kinoite"' /etc/os-release

  # Last step: all dnf5 calls above are done. See files/system/usr/libexec/x27-dnf-guard.
  - type: containerfile
    snippets:
      - |
        RUN mv /usr/bin/dnf5 /usr/libexec/dnf5-real \
            && ln -s /usr/libexec/x27-dnf-guard /usr/bin/dnf5 \
            && test "$(readlink -f /usr/bin/dnf)" = /usr/libexec/x27-dnf-guard \
            && dnf5 --version

  - type: signing
