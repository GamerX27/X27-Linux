---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: x27-linux-gaming
description: X27-Linux (Gaming) - X27-Linux plus Steam, Faugus, Heroic, RPM Fusion codecs, and RPM Fusion's freeworld Mesa VA-API/Vulkan drivers
base-image: ghcr.io/gamerx27/x27-linux
image-version: 44

# Builds on x27-linux (recipe.yml): system config, Brave, VLC/Bazaar, topgrade, the CachyOS
# kernel and cachyos-settings, and the dnf guard all come from there. build.yml builds it first.
modules:
  # Gaming overlay: proton-cachyos-install command at /usr/bin, animations off
  # (etc/xdg/kdeglobals), and the taskbar launcher pins over the base's. auto-update sets
  # rpm-ostreed's AutomaticUpdatePolicy to stage.
  - type: files
    files:
      - source: gaming
        destination: /
      - source: auto-update
        destination: /

  # Auto-updates: the image is staged in the background and used on the next reboot, and
  # Flatpaks update daily. bootc-fetch-apply-updates.timer stays masked since it reboots.
  # The Kinoite base masks rpm-ostreed-automatic.timer, and this module enables before it
  # unmasks, so the unmask is its own module first.
  - type: systemd
    system:
      unmasked:
        - rpm-ostreed-automatic.timer

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer
        - x27-flatpak-update.timer
    user:
      disabled:
        - topgrade-reminder.timer

  # Gaming extras from bieszczaders/kernel-cachyos-addons on top of the base's cachyos-settings
  # and scx-scheds: ananicy-cpp and scx-manager, with scx_loader (scx_lavd,
  # files/gaming/etc/scx_loader) and ananicy-cpp enabled.
  # power-profiles-daemon replaces tuned-ppd for powerprofilesctl, which game-performance needs.
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y copr enable bieszczaders/kernel-cachyos-addons \
            && dnf5 -y install ananicy-cpp cachyos-ananicy-rules scx-manager \
            && dnf5 -y copr disable bieszczaders/kernel-cachyos-addons \
            && dnf5 -y swap tuned-ppd power-profiles-daemon \
            && rpm -q cachyos-settings scx-scheds scx-tools ananicy-cpp cachyos-ananicy-rules scx-manager \
            && command -v powerprofilesctl \
            && systemctl enable scx_loader.service ananicy-cpp.service power-profiles-daemon.service

  # Fedora's own updates repo ships a unified libfdk-aac (Obsoletes fdk-aac/fdk-aac-free,
  # x86_64 only) that's already installed before this module runs, blocking the i686
  # fdk-aac-free build steam.i686 needs (pipewire-alsa -> libfdk-aac.so.2 chain). Swap the
  # installed package for the patent-safe fdk-aac-free first, then add the i686 build
  # explicitly, before steam can pull in pipewire's i686 deps. Guarded by `rpm -q` so it's
  # a no-op once Fedora stops shipping libfdk-aac by default. Needs a containerfile RUN
  # since the declarative dnf module has no swap/exclude support.
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y install \
              https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm \
              https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm \
            && if rpm -q libfdk-aac >/dev/null 2>&1; then dnf5 -y swap libfdk-aac fdk-aac-free; fi \
            && dnf5 -y install --skip-unavailable --exclude=libfdk-aac fdk-aac-free.i686 \
            && dnf5 -y copr enable faugus/faugus-launcher \
            && dnf5 -y install --skip-unavailable --exclude=libfdk-aac \
                 steam steam-devices gamemode gamescope mangohud goverlay \
                 faugus-launcher \
                 mesa-vulkan-drivers mesa-vulkan-drivers.i686 vulkan-loader vulkan-tools amd-gpu-firmware \
            && dnf5 -y copr disable faugus/faugus-launcher

  # Heroic from its GitHub releases (the atim COPR stopped updating), checked against the sha512
  # in latest-linux.yml. The RPM installs to /opt, which is /var/opt on bootc and never updated
  # after first install, so it's moved to /usr/lib/heroic.
  - type: containerfile
    snippets:
      - |
        RUN set -eu \
            && BASE=https://github.com/Heroic-Games-Launcher/HeroicGamesLauncher/releases/latest/download \
            && curl -fsSL -o /tmp/heroic.yml "$BASE/latest-linux.yml" \
            && VER="$(sed -n 's/^version: //p' /tmp/heroic.yml)" \
            && RPM="Heroic-${VER}-linux-x86_64.rpm" \
            && SHA="$(grep -A1 "url: ${RPM}" /tmp/heroic.yml | sed -n 's/.*sha512: //p')" \
            && curl -fsSL -o "/tmp/${RPM}" "$BASE/${RPM}" \
            && test "$(openssl dgst -sha512 -binary "/tmp/${RPM}" | base64 -w0)" = "$SHA" \
            && OPT_LINK="$(readlink /opt || true)" \
            && if [ -n "$OPT_LINK" ]; then rm /opt && mkdir /opt; fi \
            && dnf5 -y install "/tmp/${RPM}" \
            && mv /opt/Heroic /usr/lib/heroic \
            && if [ -n "$OPT_LINK" ]; then rmdir /opt && ln -s "$OPT_LINK" /opt; fi \
            && { update-alternatives --remove-all heroic 2>/dev/null || true; } \
            && ln -sf /usr/lib/heroic/heroic /usr/bin/heroic \
            && sed -i 's|/opt/Heroic|/usr/lib/heroic|g' /usr/share/applications/heroic.desktop \
            && rm -f /tmp/heroic.yml "/tmp/${RPM}" \
            && test -x "$(readlink -f /usr/bin/heroic)" \
            && grep -q '^Exec=/usr/lib/heroic/heroic' /usr/share/applications/heroic.desktop \
            && echo "Heroic ${VER}"

  # libheif-ffmpeg (already installed via Fedora's updates repo) pins libheif to a version
  # newer than RPM Fusion's libheif-freeworld supports, blocking the @multimedia group's
  # libheif swap - removed first, guarded by `rpm -q` so it's a no-op once Fedora stops
  # shipping it. pipewire-codec-aptx conflicts at the file level with Fedora's own
  # pipewire-libs-extra (same .so path) - excluded from the group install.
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y config-manager setopt fedora-cisco-openh264.enabled=1 \
            && if rpm -q libheif-ffmpeg >/dev/null 2>&1; then dnf5 -y remove --no-autoremove libheif-ffmpeg; fi \
            && dnf5 -y swap ffmpeg-free ffmpeg --allowerasing \
            && dnf5 -y install @multimedia --exclude=libfdk-aac,libheif-ffmpeg,pipewire-codec-aptx,PackageKit-gstreamer-plugin --setopt="install_weak_deps=False"

  # Prebuilt RPM Fusion swap, not a from-source Mesa build - that hit Fedora's mesa.spec
  # needing dynamic Rust/cargo BuildRequires that plain rpmbuild outside mock can't resolve.
  - type: containerfile
    snippets:
      - |
        RUN dnf5 -y install mesa-va-drivers-freeworld \
            && dnf5 -y swap mesa-vulkan-drivers mesa-vulkan-drivers-freeworld \
            && dnf5 -y install mesa-va-drivers-freeworld.i686 \
            && dnf5 -y swap mesa-vulkan-drivers.i686 mesa-vulkan-drivers-freeworld.i686 \
            && rpm -q mesa-va-drivers-freeworld mesa-vulkan-drivers-freeworld

  # Sanity check: files/gaming's layout.js pins these desktop files in the taskbar.
  - type: containerfile
    snippets:
      - |
        RUN test -f /usr/share/applications/steam.desktop \
            && test -f /usr/share/applications/org.kde.dolphin.desktop \
            && test -f /usr/share/applications/org.kde.konsole.desktop \
            && test -f /usr/share/applications/brave-origin.desktop

  - type: containerfile
    snippets:
      # VARIANT stays Kinoite: topgrade uses it to pick rpm-ostree over dnf.
      # Set directly here, not via BlueBuild's os-release module: a value substituted into
      # the recipe by an earlier workflow step doesn't survive blue-build's own checkout
      # right before the build starts.
      - |
        RUN set -eu \
            && BUILD_DATE="$(date -u +%Y-%m-%d)" \
            && . /etc/os-release \
            && sed -i --follow-symlinks -e '/^NAME=/d' -e '/^PRETTY_NAME=/d' -e '/^BUILD_ID=/d' /etc/os-release \
            && printf 'NAME="X27-Linux"\nPRETTY_NAME="X27-Linux %s Gaming (%s)"\nBUILD_ID="%s-%s"\n' \
                 "${VERSION_ID}" "${BUILD_DATE}" "${VERSION_ID}" "${BUILD_DATE}" >> /etc/os-release \
            && grep -qx 'VARIANT="Kinoite"' /etc/os-release

  # The dnf guard comes from the base image; the build container gets the real dnf5 through it.
  # Re-applied only if a package update above replaced the symlink.
  - type: containerfile
    snippets:
      - |
        RUN if [ ! -L /usr/bin/dnf5 ]; then \
              mv /usr/bin/dnf5 /usr/libexec/dnf5-real \
              && ln -s /usr/libexec/x27-dnf-guard /usr/bin/dnf5; \
            fi \
            && test "$(readlink -f /usr/bin/dnf)" = /usr/libexec/x27-dnf-guard \
            && dnf5 --version

  - type: signing
