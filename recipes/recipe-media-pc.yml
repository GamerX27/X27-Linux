---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: x27-linux-media-pc
description: X27-Linux (Media PC) - X27-Linux with the CachyOS LTS kernel, Jellyfin Desktop, Finamp, and LocalSend for a living-room media box
base-image: ghcr.io/gamerx27/x27-linux-lts
image-version: 44

# Builds on x27-linux-lts (recipe-lts.yml): system config, Brave, VLC/Bazaar, topgrade, the
# CachyOS LTS kernel and cachyos-settings, and the dnf guard all come from there.
# build.yml builds it first.
modules:
  # Media-pc overlay: taskbar pins for Dolphin, Jellyfin Desktop, VLC, and Finamp over the base's.
  # auto-update sets rpm-ostreed's AutomaticUpdatePolicy to stage.
  - type: files
    files:
      - source: media-pc
        destination: /
      - source: auto-update
        destination: /

  # Auto-updates: the image is staged in the background and used on the next reboot, and
  # Flatpaks update daily. bootc-fetch-apply-updates.timer stays masked since it reboots.
  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer
        - x27-flatpak-update.timer
    user:
      disabled:
        - topgrade-reminder.timer

  # VLC comes from the ISO (flatpak_refs/); these are listed again so rebased systems still
  # get them if this list replaces the base's. Bazaar is an RPM from the base image.
  - type: default-flatpaks@v1
    notify: true
    system:
      install:
        - org.videolan.VLC
        - org.kde.kate
        - org.kde.kwrite
        - org.kde.filelight
        - org.kde.kcharselect
        - org.kde.kfind
        - com.github.wwmm.easyeffects
        - org.jellyfin.JellyfinDesktop
        - com.unicornsonlsd.finamp
        - org.localsend.localsend_app
      remove:
        - io.github.kolunmi.Bazaar

  - type: containerfile
    snippets:
      # VARIANT stays Kinoite: topgrade uses it to pick rpm-ostree over dnf.
      # Set directly here, not via BlueBuild's os-release module: a value substituted into
      # the recipe by an earlier workflow step doesn't survive blue-build's own checkout
      # right before the build starts.
      - |
        RUN set -eu \
            && BUILD_DATE="$(date -u +%Y-%m-%d)" \
            && . /etc/os-release \
            && sed -i --follow-symlinks -e '/^NAME=/d' -e '/^PRETTY_NAME=/d' -e '/^BUILD_ID=/d' /etc/os-release \
            && printf 'NAME="X27-Linux"\nPRETTY_NAME="X27-Linux %s Media PC (%s)"\nBUILD_ID="%s-%s"\n' \
                 "${VERSION_ID}" "${BUILD_DATE}" "${VERSION_ID}" "${BUILD_DATE}" >> /etc/os-release \
            && grep -qx 'VARIANT="Kinoite"' /etc/os-release

  # The dnf guard comes from the base image. Re-applied only if something replaced the symlink.
  - type: containerfile
    snippets:
      - |
        RUN if [ ! -L /usr/bin/dnf5 ]; then \
              mv /usr/bin/dnf5 /usr/libexec/dnf5-real \
              && ln -s /usr/libexec/x27-dnf-guard /usr/bin/dnf5; \
            fi \
            && test "$(readlink -f /usr/bin/dnf)" = /usr/libexec/x27-dnf-guard \
            && dnf5 --version

  - type: signing
