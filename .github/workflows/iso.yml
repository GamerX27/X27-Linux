name: build-iso
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build an installer for (all builds every image)"
        required: false
        default: x27-linux
        type: choice
        options:
          - all
          - x27-linux
          - x27-linux-lts
          - x27-linux-gaming
          - x27-linux-desktop
          - x27-linux-media-pc
      cleanup_only:
        description: "Skip the build; only prune superseded versions from the Internet Archive item"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build ISO (${{ matrix.image }})
    runs-on: ubuntu-latest
    # cleanup_only runs a single x27-linux job, the only image mirrored to the Internet Archive.
    strategy:
      fail-fast: false
      matrix:
        image: >-
          ${{ fromJSON(inputs.cleanup_only && '["x27-linux"]'
          || inputs.image == 'all' && '["x27-linux","x27-linux-lts","x27-linux-gaming","x27-linux-desktop","x27-linux-media-pc"]'
          || format('["{0}"]', inputs.image)) }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Maximize build space
        if: ${{ !inputs.cleanup_only }}
        uses: ublue-os/remove-unwanted-software@v9

      # Not `bluebuild generate-iso`: BlueBuild CLI (v0.9.37) pins build-container-installer v1.4.0,
      # whose lorax templates strip /usr/sbin/load_policy. Anaconda 44.30 runs it on exit, crashes,
      # and hangs at the end-of-install Reboot button. v1.5.0 keeps it. Same inputs BlueBuild passed,
      # plus the Flatpaks in flatpak_refs/ (and their runtimes), which Anaconda installs offline.
      - name: Generate ISO
        if: ${{ !inputs.cleanup_only }}
        uses: JasonN3/build-container-installer@v1.5.0
        with:
          image_repo: ghcr.io/gamerx27
          image_name: ${{ matrix.image }}
          image_tag: latest
          version: "44"
          variant: kinoite
          iso_name: ${{ matrix.image }}.iso
          secure_boot_key_url: https://github.com/ublue-os/bazzite/raw/main/secure_boot.der
          enrollment_password: universalblue
          web_ui: "false"
          flatpak_remote_name: flathub
          flatpak_remote_url: https://flathub.org/repo/flathub.flatpakrepo
          flatpak_remote_refs_dir: flatpak_refs

      - name: Generate checksum
        if: ${{ !inputs.cleanup_only }}
        run: sha256sum ${{ matrix.image }}.iso > ${{ matrix.image }}.iso.sha256sum

      # Not a GitHub Release: the ISO exceeds Releases' 2 GiB per-asset limit. Artifacts
      # have no such cap, at the cost of requiring GitHub login and a 60-day expiry.
      - name: Upload ISO as artifact
        if: ${{ !inputs.cleanup_only }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.image }}-iso
          path: |
            ${{ matrix.image }}.iso
            ${{ matrix.image }}.iso.sha256sum
          if-no-files-found: error
          retention-days: 60

      # Public, permanent, no-login mirror. Re-running this uploads over the same
      # archive.org item (identifier stays fixed), so the download link never changes.
      - name: Upload ISO to Internet Archive
        if: ${{ !inputs.cleanup_only && matrix.image == 'x27-linux' }}
        env:
          IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          if [ -z "$IA_ACCESS_KEY_ID" ] || [ -z "$IA_SECRET_ACCESS_KEY" ]; then
            echo "IA_ACCESS_KEY/IA_SECRET_KEY not set, skipping Internet Archive upload."
            exit 0
          fi
          pip install --quiet internetarchive
          ia upload x27-linux x27-linux.iso x27-linux.iso.sha256sum \
            --metadata="title:X27-Linux Installer ISO" \
            --metadata="mediatype:software" \
            --metadata="collection:open_source_software" \
            --metadata="description:Custom Fedora Kinoite installer ISO, built with BlueBuild. https://github.com/GamerX27/X27-Linux"

      # ia upload keeps the file it replaces as a "history/files/<name>.~N~" backup instead
      # of deleting it, so re-running the step above (or this one via cleanup_only) grows
      # the item indefinitely. We only ever want the current ISO reachable, so prune those
      # backups every time. Unverified here (no archive.org write access in this sandbox):
      # `ia delete --glob` matching remote paths.
      - name: Prune superseded Internet Archive versions
        if: ${{ matrix.image == 'x27-linux' }}
        env:
          IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          if [ -z "$IA_ACCESS_KEY_ID" ] || [ -z "$IA_SECRET_ACCESS_KEY" ]; then
            echo "IA_ACCESS_KEY/IA_SECRET_KEY not set, skipping Internet Archive cleanup."
            exit 0
          fi
          pip install --quiet internetarchive
          ia delete x27-linux --glob 'history/files/*'
