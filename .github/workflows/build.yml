name: build
on:
  schedule:
    - cron: "00 17 * * 0" # rebuild weekly, Sundays at 5:00 PM UTC, to pick up upstream Kinoite/Brave updates
  push:
    paths:
      - "recipes/**"
      - "files/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-image.yml"
    branches:
      - main
  pull_request:
    paths:
      - "recipes/**"
      - "files/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe to build (all runs the full matrix)"
        required: false
        default: all
        type: choice
        options:
          - all
          - recipe.yml
          - recipe-lts.yml
          - recipe-gaming.yml
          - recipe-media-pc.yml
          - recipe-desktop.yml

# Gaming and Desktop build FROM x27-linux and Media PC FROM x27-linux-lts, so each waits for its base.
# A variant still runs if its base was skipped (dispatching only that variant) and then
# builds on the last published base. PR builds don't push, so PR variants do the same.
jobs:
  main:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","recipe.yml"]'), inputs.recipe)
    uses: ./.github/workflows/build-image.yml
    with:
      recipe: recipe.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  lts:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","recipe-lts.yml"]'), inputs.recipe)
    uses: ./.github/workflows/build-image.yml
    with:
      recipe: recipe-lts.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  gaming:
    needs: main
    if: >-
      always() && contains(fromJSON('["success","skipped"]'), needs.main.result)
      && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","recipe-gaming.yml"]'), inputs.recipe))
    uses: ./.github/workflows/build-image.yml
    with:
      recipe: recipe-gaming.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  desktop:
    needs: main
    if: >-
      always() && contains(fromJSON('["success","skipped"]'), needs.main.result)
      && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","recipe-desktop.yml"]'), inputs.recipe))
    uses: ./.github/workflows/build-image.yml
    with:
      recipe: recipe-desktop.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  media-pc:
    needs: lts
    if: >-
      always() && contains(fromJSON('["success","skipped"]'), needs.lts.result)
      && (github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","recipe-media-pc.yml"]'), inputs.recipe))
    uses: ./.github/workflows/build-image.yml
    with:
      recipe: recipe-media-pc.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  # A GitHub Release per build, with what changed (scripts/release-notes.sh). The weekly
  # scheduled build is vYYYY.MM.DD; pushes and dispatches are minor releases vYYYY.MM.DD.N.
  # Runs when no image build failed; a single-recipe dispatch skips the other images, which
  # the notes then take from their last published :44.
  release:
    needs: [main, lts, gaming, desktop, media-pc]
    if: >-
      always() && github.event_name != 'pull_request'
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: ./scripts/release-notes.sh
