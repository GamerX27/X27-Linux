name: build
on:
  schedule:
    - cron: "00 17 * * 0" # rebuild weekly, Sundays at 5:00 PM UTC, to pick up upstream Kinoite/Brave updates
  push:
    paths:
      - "recipes/**"
      - "files/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-image.yml"
      - "scripts/release-notes.sh"
    branches:
      - main
  pull_request:
    paths:
      - "recipes/**"
      - "files/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-image.yml"
      - "scripts/release-notes.sh"
  workflow_dispatch:

# Gated on github.server_url so the Forgejo mirror (git.xlabsx27.com), whose Actions also read
# .github/workflows, skips it; it only runs on GitHub.
jobs:
  main:
    if: github.server_url == 'https://github.com'
    uses: ./.github/workflows/build-image.yml
    with:
      recipe: recipe.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  # A GitHub Release per build, with what changed (scripts/release-notes.sh). The weekly
  # scheduled build is vYYYY.MM.DD; pushes and dispatches are minor releases vYYYY.MM.DD.N.
  release:
    needs: main
    if: github.server_url == 'https://github.com' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Package list from this run's build job (build-image.yml). Without it,
      # release-notes.sh pulls the image itself.
      - name: Download package lists
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/packages

      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PACKAGES_DIR: ${{ runner.temp }}/packages
        run: ./scripts/release-notes.sh
